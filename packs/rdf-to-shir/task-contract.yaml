pack_id: rdf-to-shir
version: 0.1.0
status: draft
tracking_issue: https://github.com/SocioProphet/prophet-platform-fabric-mlops-ts-suite/issues/36
purpose: Compile a deterministic RDF/Turtle subset into SHIR JSON artifacts.
inputs:
  - name: input
    type: file
    media_type: text/turtle
    required: true
    description: Turtle fixture in the v0.1 supported subset.
  - name: schema_dir
    type: directory
    required: false
    description: Optional semantic-serdes schemas directory for output validation.
outputs:
  - name: candidate_assertion
    path: candidate_assertion.json
    schema: shir_candidate_assertion.schema.json
  - name: assertion
    path: assertion.json
    schema: shir_assertion.schema.json
  - name: receipt
    path: receipt.json
    schema: shir_receipt.schema.json
  - name: compile_error
    path: compile_error.json
    required_on_failure: true
runtime:
  language: python
  minimum_version: '3.11'
  dependency_profile:
    required: []
    optional_validation:
      - jsonschema
commands:
  compile: >-
    python packs/rdf-to-shir/tools/rdf_to_shir.py
    --input packs/rdf-to-shir/fixtures/topolvm.ttl
    --out-dir /tmp/rdf-to-shir-out
  compile_with_validation: >-
    python packs/rdf-to-shir/tools/rdf_to_shir.py
    --input packs/rdf-to-shir/fixtures/topolvm.ttl
    --out-dir /tmp/rdf-to-shir-out
    --schema-dir ../semantic-serdes/schemas
guarantees:
  - Candidate assertions are marked DERIVED / INFERRED and require review.
  - Generated assertions preserve connector role bindings and evidence anchors.
  - Receipts include source hashes, ontology profile, transform identity, policy decision, output hashes, and replay metadata.
  - Invalid RDF-family input emits compile_error.json and exits non-zero.
  - The pack does not emit graph-ML artifacts directly.
non_goals:
  - Full RDF parsing.
  - PyG or DGL materialization.
  - Ontology promotion.
  - Proprietary Hyperknowledge runtime dependency.
