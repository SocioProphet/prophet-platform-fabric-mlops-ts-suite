name: Validate Google Workspace Ops Mesh

on:
  pull_request:
    paths:
      - 'infra/google-workspace-ops-mesh/**'
      - 'scripts/validate_google_workspace_ops_mesh.py'
      - '.github/workflows/validate-google-workspace-ops-mesh.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'infra/google-workspace-ops-mesh/**'
      - 'scripts/validate_google_workspace_ops_mesh.py'
      - '.github/workflows/validate-google-workspace-ops-mesh.yml'
  workflow_dispatch:

jobs:
  validate-google-workspace-ops-mesh:
    name: Validate Google Workspace Ops Mesh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate mesh scaffold
        run: python3 scripts/validate_google_workspace_ops_mesh.py
